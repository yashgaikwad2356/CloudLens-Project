<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CloudLens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <div class="popup-brand">
        <span class="mark"></span>
        <div>
          <strong>CloudLens</strong>
          <span class="sub">AI cloud assistant</span>
        </div>
      </div>
      <p id="status" class="status">Loading…</p>
      <div class="actions">
        <button type="button" id="open-dash" class="btn primary">Open dashboard</button>
        <button type="button" id="open-options" class="btn ghost">Templates &amp; tests</button>
      </div>
      <p class="hint">Use the floating button on any page once a template is active.</p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
